services:
  mongodb:
    image: mongo:4.4.29
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      FISHTEST_HOST: mongodb
      PYTHONUNBUFFERED: "1"
    ports:
      - "6543:6543"
    volumes:
      - ./secrets/fishtest.secret:/root/fishtest.secret:ro
      - ./secrets:/run/xfishtest:ro

  sprt-watcher:
    build:
      context: ./server
    command: ["python", "/opt/xfishtest/admin.py", "watch-sprt", "--poll-seconds", "2"]
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      FISHTEST_HOST: mongodb
      PYTHONUNBUFFERED: "1"

volumes:
  mongodb-data:
