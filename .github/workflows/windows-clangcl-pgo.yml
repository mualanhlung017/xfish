name: Windows clang-cl AVX2 PGO

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/windows-clangcl-pgo.yml'
      - 'CMakeLists.txt'
      - 'scripts/build-clangcl-pgo.ps1'
      - 'src/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build xfish AVX2 with clang-cl, LTO, and PGO
        shell: pwsh
        run: ./scripts/build-clangcl-pgo.ps1 -Clean

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: xfish-windows-x64-avx2-pgo
          path: artifacts/xfish-windows-x64-avx2-pgo.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/xfish-windows-x64-avx2-pgo.zip --generate-notes --verify-tag
